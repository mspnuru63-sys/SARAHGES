      <div class="field"><label>Nom</label><input type="text" id="shopName" value="${esc(name)}" placeholder="Ex : Chez Mama"></div>

        <div class="stat-mini"><b>${STATE.batches.length}</b><small>Lots</small></div>
        <div class="stat-mini"><b>${STATE.sales.length}</b><small>Ventes</small></div>

    ${cloudCardHTML()}

      <p style="font-size:.78rem;color:var(--muted);margin-bottom:12px">Réinitialiser l'application supprimera définitivement toutes vos données.</p>
      <button class="btn danger full" onclick="resetAll()">${ic('trash',16)}Réinitialiser</button>
    </div>

    <div style="text-align:center;color:var(--muted);font-size:.7rem;margin-top:20px;padding:12px">
      restodiaf v1.0 · ${new Date().getFullYear()}
    </div>
  `;
}
window.saveShopName=async function(){
  const v=$('#shopName').value.trim()||'restodiaf';
  await idbPut('settings',{key:'shopName',value:v});
  STATE.settings.shopName=v;
  $('#headerTitle').textContent=v;
  $('#headerLogo').textContent=v[0].toUpperCase();
  toast('Enregistré','success');
};
window.exportJSON=function(){
  const payload={app:'restodiaf',version:1,createdAt:new Date().toISOString(),dishes:STATE.dishes,batches:STATE.batches,sales:STATE.sales,settings:STATE.settings};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`restodiaf-backup-${todayStr()}.json`;
  a.click();URL.revokeObjectURL(url);
  toast('Sauvegarde téléchargée','success');
};
window.exportCSV=function(){
  const rows=[['Date','Type','Nom','Quantité','Prix unitaire','Total','Source']];
  STATE.sales.forEach(s=>rows.push([s.date||'',s.source==='stock'?'Stock':'Plat',s.name||'',s.qty||0,s.unitPrice||0,s.total||0,s.source||'']));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`restodiaf-ventes-${todayStr()}.csv`;
  a.click();URL.revokeObjectURL(url);
  toast('CSV téléchargé','success');
};
window.resetAll=async function(){
  if(!confirm('Supprimer TOUTES les données ? Action irréversible.'))return;
  if(!confirm('Confirmez-vous la suppression totale ?'))return;
  await Promise.all([idbClear('dishes'),idbClear('batches'),idbClear('sales'),idbClear('settings')]);
  STATE.dishes=[];STATE.batches=[];STATE.sales=[];STATE.settings={};
  $('#headerTitle').textContent='restodiaf';
  $('#headerLogo').textContent='R';
  renderView();
  toast('Application réinitialisée','success');
};

/* ============================================================
   PWA
   ============================================================ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(!localStorage.getItem('installDismissed'))$('#installBanner')?.classList.remove('hidden');
});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;$('#installBanner')?.classList.add('hidden');
});
function setupManifest(){
  const iconSvg="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='#1a2340'/><text x='256' y='350' font-family='Arial,sans-serif' font-size='290' font-weight='900' fill='#f5c542' text-anchor='middle'>R</text></svg>`);
  const manifest={name:'restodiaf',short_name:'restodiaf',description:'Gestion de restaurant.',start_url:'.',display:'standalone',orientation:'portrait',background_color:'#1a2340',theme_color:'#1a2340',lang:'fr',icons:[{src:iconSvg,sizes:'192x192',type:'image/svg+xml',purpose:'any'},{src:iconSvg,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
  const link=$('#manifest-link');
  if(link)link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  setupManifest();
  try{
    await openDB();
    await loadAll();
    let name=STATE.settings.shopName||'restodiaf';
    $('#headerTitle').textContent=name;
    $('#headerLogo').textContent=name[0].toUpperCase();
    /* Chargement des données depuis Firebase dès l'ouverture (5 s maximum d'attente) */
    if(Cloud.configured()){
      toast('Chargement depuis Firebase…','',4000);
      Cloud.start();
      await Promise.race([Cloud.whenLoaded(),new Promise(r=>setTimeout(r,5000))]);
      await loadAll();
      name=STATE.settings.shopName||'restodiaf';
      $('#headerTitle').textContent=name;
      $('#headerLogo').textContent=name[0].toUpperCase();
    }
  }catch(e){console.error(e);toast('Erreur d\'initialisation','err');}
  Cloud.markReady();
  go('dash');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-bg.on').forEach(m=>m.remove());});
init();
